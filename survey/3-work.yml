title: Work
label: work
position: 3
showIf:
  question: profile-q-5
  notEquals: 0
questions:
  - label: What is your employment status?
    required: true
    multiple: false
    choices:
      - Founder/entrepreneur
      - Full-time employee
      - Freelancer/self-employed
      - Part-time employee
      - Looking for work
      - Internship
      - Student
      - Other

  # routing question: salary + employer questions below depend on it (keep choice order)
  - label: Which best describes your current work setup?
    required: true
    choices:
      - Employee of a company in Morocco (incl. Moroccan offices of foreign groups)
      - Employee working remotely for a foreign company, living in Morocco
      - Employee living and working abroad
      - Freelancer with mostly Moroccan clients
      - Freelancer with mostly foreign clients
      - Founder / running my own company
      - Not working right now (student, looking for work, other)

  - label: What type of contract do you have?
    required: false
    showIf:
      question: work-q-1
      in: [0, 1]
    choices:
      - CDI
      - CDD
      - ANAPEC / insertion contract
      - Through an intermediary (portage, EOR, staffing agency)
      - No formal contract
      - Other

  - label: How often do you work overtime or beyond the normal time expectation of your job?
    required: false
    showIf:
      question: work-q-1
      notEquals: 6
    choices:
      - Never
      - "Rarely: 1-2 days per year or less"
      - "Occasionally: 1-2 days per quarter but less than monthly"
      - "Sometimes: 1-2 days per month but less than weekly"
      - "Often: 1-2 days per week or more"
      - "Very often: 3-5 days per week"
      - Daily

  - label: How do you feel about your job?
    required: false
    showIf:
      question: work-q-1
      notEquals: 6
    choices:
      - Very Unsatisfied
      - Slightly Unsatisfied
      - Neither satisfied nor Unsatisfied
      - Slightly satisfied
      - Very satisfied

  - label: How long have you been unemployed after graduation?
    required: false
    choices:
      - None, I worked straight after my graduation 😎
      - Up to 3 months
      - Up to 6 months
      - Up to 1 year
      - More than 1 year
      - I haven't graduated yet

  - label: "Your NET monthly salary in MAD (or MAD equivalent if paid in another currency) is:"
    required: false
    showIf:
      question: work-q-1
      in: [0, 1]
    choices:
      - < 4 000
      - 4 000 - 6 000
      - 6 000 - 8 000
      - 8 000 - 10 000
      - 10 000 - 12 000
      - 12 000 - 14 000
      - 14 000 - 16 000
      - 16 000 - 18 000
      - 18 000 - 20 000
      - 20 000 - 22 000
      - 22 000 - 25 000
      - 25 000 - 30 000
      - 30 000 - 40 000
      - 40 000 - 60 000
      - "> 60 000"

  - label: "Your gross salary range per year in USD is:"
    required: false
    showIf:
      question: work-q-1
      equals: 2
    choices:
      - < 20 000
      - 20 000 - 25 000
      - 25 000 - 30 000
      - 30 000 - 40 000
      - 40 000 - 50 000
      - 50 000 - 60 000
      - 60 000 - 80 000
      - 80 000 - 100 000
      - 100 000 - 120 000
      - 120 000 - 150 000
      - 150 000 - 200 000
      - "> 200 000"

  - label: "Your daily rate (TJM) in MAD (or MAD equivalent) is:"
    required: false
    showIf:
      question: work-q-1
      in: [3, 4]
    choices:
      - < 500
      - 500 - 1 000
      - 1 000 - 1 500
      - 1 500 - 2 000
      - 2 000 - 2 500
      - 2 500 - 3 000
      - 3 000 - 4 000
      - 4 000 - 5 000
      - 5 000 - 7 500
      - "> 7 500"

  - label: What characteristics would mostly influence your decision to choose one job offer over another?
    required: true
    multiple: true
    choices:
      - Languages, frameworks, and other technologies I'd be working on
      - Office environment or company culture
      - Flexible time or schedule
      - Opportunities for professional development (training, certifications)
      - Remote work options
      - How widely used or impactful my work output would be
      - The industry that I'd be working in
      - Salary
      - Stock options/equity
      - Benefits package (health insurance, pension, etc.)
      - Work-life balance
      - Company mission/values alignment
      - Visa/relocation support

  - label: What type of company do you prefer?
    required: true
    choices:
      - Self-employed
      - Company under 10 employees
      - Company between 11 and 30 employees
      - Company between 31 and 100 employees
      - Company above 100 employees
      - Other

  - label: What type of company do you currently work for?
    required: false
    showIf:
      question: work-q-1
      in: [0, 1, 2]
    choices:
      - IT services / consulting (ESN, SSII)
      - Offshore / nearshore delivery center
      - Startup
      - Software product / SaaS company
      - Bank, insurance or large corporate
      - Public sector / government
      - Other

  - label: What agile software development methodology do you use in your team, if any?
    required: false
    showIf:
      question: work-q-1
      notEquals: 6
    choices:
      - Scrum
      - Kanban
      - XP
      - SAFe
      - Other
      - None

  - label: What remote work arrangement does your current employer offer?
    required: false
    showIf:
      question: work-q-1
      in: [0, 1, 2]
    choices:
      - Back to office
      - Full remote
      - Hybrid

  - label: What is your preferred mode of work?
    required: true
    choices:
      - From the office
      - Full remote
      - Part-time remote/Hybrid

  - label: Which sectors are you currently working in?
    multiple: true
    required: false
    showIf:
      question: work-q-1
      notEquals: 6
    choices:
      - IT services and consulting
      - Software / SaaS
      - Traditional banking and insurance
      - E-banking and fintech
      - Digital health and telemedicine
      - E-commerce and retail
      - Education and e-learning
      - Content creation and marketing
      - Media
      - Cybersecurity
      - Supply chain and logistics
      - Smart cities and IoT
      - Autonomous vehicles
      - Automotive and aerospace
      - Manufacturing and Industry 4.0
      - Outsourcing / offshoring (BPO)
      - Environmental monitoring and sustainability
      - Legal tech and compliance
      - Human resources and talent management
      - Gaming and entertainment
      - Travel and hospitality tech
      - Real estate/PropTech
      - Energy and renewable tech
      - Telecommunications
      - Agriculture tech (AgTech)
      - Blockchain/Web3
      - Government/Public sector
      - Other

  - label: What best describes your relationship with entrepreneurship?
    required: false
    showIf:
      question: work-q-0
      notEquals: 0
    choices:
      - Currently building a side project/startup while employed
      - Planning to start a business within the next year
      - Interested, but not ready yet (2-5 years)
      - Interested, but lack a viable business idea
      - Interested, but need more business/entrepreneurship knowledge
      - Interested, but financial risk is too high
      - Interested, but family/social pressure for stable job
      - Interested, but legal/administrative barriers in Morocco
      - Tried entrepreneurship before, didn't work out
      - Not interested, prefer working for a company
      - Not interested, prefer technical work over business
      - Other
