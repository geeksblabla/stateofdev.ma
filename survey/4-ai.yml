title: AI
label: ai
position: 4
questions:
  - label: "How often do you use AI tools for Dev (Github Copilot, ChatGPT ...) "
    required: true
    choices:
      - Daily
      - Occasionally
      - Tried them but not interested
      - Never

  - label: "If you are using AI based coding assistants for Dev, How much improvement do you see in your productivity?"
    showIf:
      question: ai-q-0
      in: [0, 1]
    choices:
      - It decreased my productivity
      - Did not improve my productivity
      - Somewhat improved my productivity (5% to 10%)
      - Helped me to become more productive (10% to 30%)
      - I am now very productive (30% to 50%)
      - I am a 10x engineer now (+50%)

  - label: What share of developer jobs do you think AI will replace in the next 5 years?
    required: false
    choices:
      - Not very much ( less than 10% )
      - Somewhat ( 10% - 30% )
      - To some extent ( 30% - 50% )
      - The majority ( 50% - 80% )
      - Completely  ( more than 80% )
      - Not sure

  - label: Are you planning to learn AI to build apps?
    required: false
    choices:
      - No, I am not interested
      - Already started learning the basics.
      - I can build simple apps with AI using third-party APIs.
      - I can build complex apps and play with models.
      - I am already an expert

  - label: How much is your company investing in AI?
    required: false
    showIf:
      question: work-q-1
      in: [0, 1, 2]
    choices:
      - We haven't started adopting AI
      - We're getting the basics in place
      - We have some ad-hoc use cases in production
      - We have several use cases in production

  - label: How do you use AI when coding?
    required: false
    multiple: true
    showIf:
      question: ai-q-0
      in: [0, 1]
    choices:
      - Autocomplete / inline suggestions
      - Chat (ask questions, explain or generate snippets)
      - Agents that edit and run code for me (Claude Code, Codex, Cursor agent...)
      - AI code review on pull requests
      - Generating tests or documentation
      - Prototyping full apps from prompts (vibe coding)
      - Other

  - label: What is your company's policy on AI coding tools?
    required: false
    showIf:
      question: work-q-1
      in: [0, 1, 2]
    choices:
      - Encouraged, tools provided by the company
      - Allowed, but I use/pay for my own tools
      - Restricted to approved tools only
      - Banned
      - No policy / I don't know

  - label: Do you think AI made it harder for junior developers to get hired in Morocco?
    required: false
    choices:
      - Yes, much harder
      - Somewhat harder
      - No real change
      - It made it easier
      - Not sure

  - label: Which AI tools and apps do you use?
    multiple: true
    choices:
      # Web/Desktop AI Assistants
      - ChatGPT
      - Claude (Anthropic)
      - Gemini (Google)
      - Perplexity AI
      - Microsoft Copilot
      - Mistral Le Chat
      - DeepSeek
      - Grok
      # AI-Native Editors
      - Cursor
      - Windsurf
      - Zed
      - Kiro
      - Google Antigravity
      # CLI/Terminal & agents
      - Claude Code (Anthropic CLI)
      - OpenAI Codex
      - Gemini CLI (Google)
      - GitHub Copilot CLI
      - OpenCode
      - Warp AI
      - Devin
      # IDE-Integrated Extensions
      - GitHub Copilot
      - JetBrains AI / Junie
      - Cline
      - Amazon Q Developer
      # Full-Stack AI Builders / Vibe Coding
      - v0 (Vercel)
      - Bolt.new (StackBlitz)
      - Lovable
      - Replit AI
      # Other
      - Other

  - label: Which AI frameworks and models do you use?
    multiple: true
    choices:
      # LLM APIs & Cloud Providers
      - OpenAI API (GPT)
      - Anthropic Claude API
      - Google Gemini API
      - AWS Bedrock
      - Groq
      # Open Source / local LLMs
      - Llama (Meta)
      - Mistral
      - Qwen (Alibaba)
      - DeepSeek
      - Ollama / LM Studio (local models)
      # Agents & Orchestration
      - MCP (Model Context Protocol)
      - LangChain
      - LangGraph
      - LlamaIndex
      - CrewAI
      - OpenAI Agents SDK
      - Google ADK
      - Pydantic AI
      - Mastra
      - Vercel AI SDK
      # ML/Deep Learning Frameworks
      - PyTorch
      - TensorFlow
      - Hugging Face Transformers
      - Keras
      - Scikit-Learn
      # Fine-tuning & MLOps
      - PEFT / LoRA (Hugging Face)
      - Unsloth
      - MLflow
      - Weights & Biases
      # Specialized Models
      - Stable Diffusion (Images)
      - Whisper (Audio)
      - BERT (Embeddings)
      # Other
      - Other
